version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "darkpyramid-org/maintainers"
    labels:
      - "dependencies"
      - "maintenance"
    commit-message:
      prefix: "chore"
      prefix-scope: "deps"
      include: "scope"
